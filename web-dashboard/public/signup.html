<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | VajraScan</title>
    <link rel="stylesheet" href="auth.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-section">
                <span class="shield-icon">🚀</span>
                <h1>Create Account</h1>
                <p class="subtitle">Start securing your cloud infrastructure</p>
            </div>

            <div class="form-group">
                <label>Work Email</label>
                <input type="email" id="email" placeholder="name@company.com">
            </div>

            <div class="form-group">
                <label>Choose Password</label>
                <input type="password" id="password" placeholder="Min. 6 characters">
            </div>

            <button class="btn-primary" onclick="signup()">Create Account</button>
            <p id="error-msg"></p>

            <p class="footer-text">
                Already have an account? <a href="login.html">Log In</a>
            </p>
        </div>
    </div>

    <script>
        function signup() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.querySelector('.btn-primary');
            const errorMsg = document.getElementById('error-msg');

            btn.innerText = "Creating Account...";
            btn.style.opacity = "0.7";
            errorMsg.innerText = "";

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Create user profile
                    const user = userCredential.user;
                    db.collection('users').doc(user.uid).set({
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        role: 'admin' // Defaulting to admin for hackathon demo
                    });
                    
                    alert("Account Created Successfully! Redirecting...");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    btn.innerText = "Create Account";
                    btn.style.opacity = "1";
                    errorMsg.innerText = "⚠️ " + error.message.replace("Firebase: ", "");
                });
        }
    </script>
</body>
</html>
