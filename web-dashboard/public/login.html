<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VajraScan</title>
    <link rel="stylesheet" href="auth.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-section">
                <span class="shield-icon">🛡️</span>
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to VajraSafe Enterprise</p>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn-primary" onclick="login()">Sign In</button>
            <p id="error-msg"></p>

            <p class="footer-text">
                Don't have an account? <a href="signup.html">Get Started</a>
            </p>
        </div>
    </div>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.querySelector('.btn-primary');
            const errorMsg = document.getElementById('error-msg');

            // Visual Feedback
            btn.innerText = "Verifying...";
            btn.style.opacity = "0.7";
            errorMsg.innerText = "";

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    btn.innerText = "Sign In";
                    btn.style.opacity = "1";
                    errorMsg.innerText = "❌ " + error.message.replace("Firebase: ", "");
                });
        }
        
        // Auto-redirect if already logged in
        auth.onAuthStateChanged(user => {
            if(user) window.location.href = "index.html";
        });
    </script>
</body>
</html>
